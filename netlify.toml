# Plain static site: nothing to build. These settings override the old
# React/Vite ones (npm run build, publish "dist") that may still be saved
# in the Netlify dashboard.
[build]
  command = "echo 'Static site, nothing to build'"
  publish = "."

# Fonts never change, so let browsers keep them for a year.
[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
